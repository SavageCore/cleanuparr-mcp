[project]
name = "cleanuparr-mcp"
version = "0.1.1"
description = "MCP server for Cleanuparr's REST API"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["fastmcp>=2.0.0"]

[project.scripts]
cleanuparr-mcp = "cleanuparr_mcp:main"

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: hits a real Cleanuparr instance (needs CLEANUPARR_URL/CLEANUPARR_API_KEY)"]
addopts = "-m 'not integration'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
